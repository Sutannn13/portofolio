<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" fill="none">
  <defs>
    <filter id="glow-openai" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
    <radialGradient id="radGlow-openai" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#10a37f" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#08080c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad-openai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid-openai" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
    </pattern>
    <linearGradient id="iconGrad-openai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Dark Base -->
  <rect width="700" height="500" rx="24" fill="#08080c" />
  <rect width="700" height="500" rx="24" fill="url(#grid-openai)" />

  <!-- Ambient Glow -->
  <circle cx="520" cy="170" r="270" fill="url(#radGlow-openai)" filter="url(#glow-openai)" />
  <circle cx="140" cy="370" r="180" fill="#10a37f" fill-opacity="0.07" filter="url(#glow-openai)" />

  <!-- Border -->
  <rect x="1.5" y="1.5" width="697" height="497" rx="23" stroke="url(#borderGrad-openai)" stroke-width="1.5" fill="none" />

  <!-- Header Pill & Meta -->
  <g transform="translate(44, 44)">
    <rect width="200" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#10a37f" />
    <text x="32" y="20.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#e5e7eb">FRONTIER INTELLIGENCE</text>
  </g>

  <g transform="translate(656, 44)">
    <text text-anchor="end" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="rgba(255,255,255,0.45)">128K TOKENS · REASONING</text>
  </g>

  <!-- Central Brand Presentation -->
  <g transform="translate(50, 142)">
    <rect width="124" height="124" rx="24" fill="#101016" stroke="url(#borderGrad-openai)" stroke-width="1.5" />
    <g transform="translate(62, 62)">
      <g transform="translate(-30, -30) scale(1.5)">
      <path fill="url(#iconGrad-openai)" d="M28.52 17.65a6.76 6.76 0 0 0-.58-5.32 6.88 6.88 0 0 0-4.04-3.32 6.88 6.88 0 0 0-5.46.21 6.8 6.8 0 0 0-4.04-3.13 6.83 6.83 0 0 0-5.59.88 6.87 6.87 0 0 0-3.38 4.25 6.82 6.82 0 0 0-1.74 5.34 6.87 6.87 0 0 0 2.22 5.09 6.8 6.8 0 0 0-.58 5.32 6.88 6.88 0 0 0 4.04 3.32 6.88 6.88 0 0 0 5.46-.21 6.8 6.8 0 0 0 4.04 3.13 6.83 6.83 0 0 0 5.59-.88 6.87 6.87 0 0 0 3.38-4.25 6.82 6.82 0 0 0 1.74-5.34 6.87 6.87 0 0 0-2.22-5.09Zm-11.4 14.54a4.4 4.4 0 0 1-2.92-1.1l4.8-2.77a.8.8 0 0 0 .4-.69v-6.78l2.03 1.17v5.82a4.42 4.42 0 0 1-4.31 4.35Zm-10.22-5.9a4.42 4.42 0 0 1-.52-3.08l4.8 2.77a.8.8 0 0 0 .8 0l5.87-3.39v2.34l-5.04 2.91a4.42 4.42 0 0 1-5.91-1.55Zm-1.8-11.83a4.4 4.4 0 0 1 2.4-1.99v5.54a.8.8 0 0 0 .4.69l5.87 3.39-2.03 1.17-5.04-2.91a4.42 4.42 0 0 1-1.6-5.89Zm16.14 4.57-5.87-3.39 2.03-1.17 5.04 2.91a4.42 4.42 0 0 1 1.6 5.89 4.4 4.4 0 0 1-2.4 1.99v-5.54a.8.8 0 0 0-.4-.69Zm3.14-3.52-4.8-2.77a.8.8 0 0 0-.8 0l-5.87 3.39V14.4l5.04-2.91a4.42 4.42 0 0 1 6.43 4.63Zm-9.3 5.37-2.67-1.54 2.67-1.54 2.67 1.54-2.67 1.54Z"/>
    </g>
    </g>

    <g transform="translate(156, 26)">
      <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-0.5">OpenAI</text>
      <text y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.65)">GPT-4o · o1 Reasoning · API</text>
      <text y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#10a37f" letter-spacing="0.3">Autonomous Reasoning & Frontier Models</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="44" y1="375" x2="656" y2="375" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Bottom Metric Strip -->
  <g transform="translate(44, 405)">
    <g transform="translate(0, 0)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.4)">CAPABILITY</text>
      <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">GPT-4o &amp; o1-preview</text>
    </g>
    <g transform="translate(215, 0)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.4)">ARCHITECTURE</text>
      <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Reinforcement RL</text>
    </g>
    <g transform="translate(435, 0)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.4)">INTEGRATION</text>
      <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#10a37f">Official API Node</text>
    </g>
  </g>
</svg>