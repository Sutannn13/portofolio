<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" fill="none">
  <defs>
    <filter id="glow-anthropic" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
    <radialGradient id="radGlow-anthropic" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#08080c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad-anthropic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid-anthropic" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
    </pattern>
    <linearGradient id="iconGrad-anthropic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Dark Base -->
  <rect width="700" height="500" rx="24" fill="#08080c" />
  <rect width="700" height="500" rx="24" fill="url(#grid-anthropic)" />

  <!-- Ambient Glow -->
  <circle cx="520" cy="170" r="270" fill="url(#radGlow-anthropic)" filter="url(#glow-anthropic)" />
  <circle cx="140" cy="370" r="180" fill="#d97706" fill-opacity="0.07" filter="url(#glow-anthropic)" />

  <!-- Border -->
  <rect x="1.5" y="1.5" width="697" height="497" rx="23" stroke="url(#borderGrad-anthropic)" stroke-width="1.5" fill="none" />

  <!-- Header Pill & Meta -->
  <g transform="translate(44, 44)">
    <rect width="165" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#d97706" />
    <text x="32" y="20.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#e5e7eb">AI RESEARCH LAB</text>
  </g>

  <g transform="translate(656, 44)">
    <text text-anchor="end" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="rgba(255,255,255,0.45)">200K CONTEXT · HYBRID CoT</text>
  </g>

  <!-- Central Brand Presentation -->
  <g transform="translate(50, 142)">
    <rect width="124" height="124" rx="24" fill="#101016" stroke="url(#borderGrad-anthropic)" stroke-width="1.5" />
    <g transform="translate(62, 62)">
      <g transform="translate(-32, -32) scale(2.0)">
      <path fill="url(#iconGrad-anthropic)" d="M14.07 4.22h3.86L26.5 27.78h-3.95l-2.08-5.32H11.53l-2.08 5.32H5.5L14.07 4.22Zm4.87 15.34-3.01-7.7-3.01 7.7h6.02Z"/>
    </g>
    </g>

    <g transform="translate(156, 26)">
      <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Anthropic</text>
      <text y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.65)">Claude 3.7 Sonnet · Opus · Haiku</text>
      <text y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d97706" letter-spacing="0.3">Hybrid Thinking &amp; Deep Code Synthesis</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="44" y1="375" x2="656" y2="375" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Bottom Metric Strip -->
  <g transform="translate(44, 405)">
    <g transform="translate(0, 0)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.4)">CAPABILITY</text>
      <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Claude 3.7 Sonnet</text>
    </g>
    <g transform="translate(215, 0)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.4)">ARCHITECTURE</text>
      <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Constitutional Safety</text>
    </g>
    <g transform="translate(435, 0)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.4)">INTEGRATION</text>
      <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#d97706">Native API Connected</text>
    </g>
  </g>
</svg>