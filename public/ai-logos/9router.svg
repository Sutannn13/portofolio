<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" fill="none">
  <defs>
    <filter id="glow-9router" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
    <radialGradient id="radGlow-9router" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#08080c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad-9router" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid-9router" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
    </pattern>
    <linearGradient id="iconGrad-9router" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Dark Base -->
  <rect width="700" height="500" rx="24" fill="#08080c" />
  <rect width="700" height="500" rx="24" fill="url(#grid-9router)" />

  <!-- Ambient Glow -->
  <circle cx="520" cy="170" r="270" fill="url(#radGlow-9router)" filter="url(#glow-9router)" />
  <circle cx="140" cy="370" r="180" fill="#f97316" fill-opacity="0.07" filter="url(#glow-9router)" />

  <!-- Border -->
  <rect x="1.5" y="1.5" width="697" height="497" rx="23" stroke="url(#borderGrad-9router)" stroke-width="1.5" fill="none" />

  <!-- Header Pill & Meta -->
  <g transform="translate(44, 44)">
    <rect width="175" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#f97316" />
    <text x="32" y="20.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#e5e7eb">AI MODEL GATEWAY</text>
  </g>

  <g transform="translate(656, 44)">
    <text text-anchor="end" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="rgba(255,255,255,0.45)">SMART FALLBACK · LOW LATENCY</text>
  </g>

  <!-- Central Brand Presentation -->
  <g transform="translate(50, 142)">
    <rect width="124" height="124" rx="24" fill="#101016" stroke="url(#borderGrad-9router)" stroke-width="1.5" />
    <g transform="translate(62, 62)">
      <g transform="translate(-30, -30) scale(1.5)">
      <circle cx="14" cy="12" r="6" fill="none" stroke="url(#iconGrad-9router)" stroke-width="2.5"/>
      <path fill="none" stroke="url(#iconGrad-9router)" stroke-width="2.5" stroke-linecap="round" d="M20 12v9a4 4 0 0 1-4 4h-3"/>
      <circle cx="24" cy="9" r="2" fill="#fb923c"/>
      <circle cx="26" cy="20" r="2" fill="#ea580c"/>
      <circle cx="8" cy="24" r="2" fill="#f97316"/>
    </g>
    </g>

    <g transform="translate(156, 26)">
      <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-0.5">9Router</text>
      <text y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.65)">Unified AI Gateway &amp; Routing Proxy</text>
      <text y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f97316" letter-spacing="0.3">Zero-Downtime Multi-Model Mesh</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="44" y1="375" x2="656" y2="375" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Bottom Metric Strip -->
  <g transform="translate(44, 405)">
    <g transform="translate(0, 0)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.4)">CAPABILITY</text>
      <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Multi-Model Fallback</text>
    </g>
    <g transform="translate(215, 0)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.4)">ARCHITECTURE</text>
      <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">High Concurrency Mesh</text>
    </g>
    <g transform="translate(435, 0)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.4)">INTEGRATION</text>
      <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f97316">Unified Protocol</text>
    </g>
  </g>
</svg>